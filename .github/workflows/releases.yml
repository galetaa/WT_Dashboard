name: Native release builds
on:
  push:
    branches: [feat/multiplatform-releases]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
      - name: Build native archive
        run: python scripts/build_release.py
      - name: Smoke test packaged executable
        run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wt-dashboard-${{ matrix.target }}
          path: |
            dist/wt-dashboard-*.tar.gz
            dist/wt-dashboard-*.zip
          if-no-files-found: error
