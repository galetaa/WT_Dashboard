name: Windows build and tests
on:
  push:
    branches: [feat/windows-battle-history]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Test
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: ./build.ps1 -SkipInstall
      - name: Smoke test packaged executable
        run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wt-dashboard-windows
          path: dist/wt-dashboard.exe
          if-no-files-found: error
